(() => {
  "use strict";

  const STORES = ["쿠팡", "코스트코", "네이버", "11번가", "기타"];
  const STORE_CLASS = { "쿠팡": "s-coupang", "코스트코": "s-costco", "네이버": "s-naver", "11번가": "s-11st" };
  const MAX_INT = 2147483647;

  // 상품명 키워드 → 썸네일 이모지 (이미지가 없을 때)
  const EMOJI_RULES = [
    [/물|생수|삼다수|에비앙|탄산/, "💧"], [/커피|원두|캡슐|라떼/, "☕"], [/아몬드|견과|땅콩|호두|캐슈/, "🥜"],
    [/라면|면|파스타/, "🍜"], [/쌀|햇반/, "🍚"], [/과자|스낵|초콜릿|쿠키/, "🍪"], [/고기|소고기|돼지|닭/, "🥩"],
    [/과일|사과|바나나|딸기|포도|귤/, "🍎"], [/우유|요거트|치즈/, "🥛"], [/와인|맥주|소주|위스키/, "🍷"],
    [/에어팟|버즈|이어폰|헤드폰|헤드셋/, "🎧"], [/마우스|MX Master|로지텍 G/, "🖱️"], [/키보드/, "⌨️"], [/노트북|맥북|그램/, "💻"],
    [/모니터|TV|티비|텔레비전/i, "🖥️"], [/아이폰|갤럭시|폰|스마트폰/, "📱"], [/아이패드|태블릿|탭/, "📲"],
    [/워치|시계/, "⌚"], [/카메라/, "📷"], [/게임|닌텐도|스위치|플스|PS5/i, "🎮"], [/청소기|다이슨|로봇청소/, "🧹"],
    [/세탁|건조기/, "🧺"], [/냉장고|밥솥|에어프라이어|전자레인지/, "🍳"], [/신발|운동화|나이키|아디다스/, "👟"],
    [/가방|백팩/, "🎒"], [/옷|티셔츠|셔츠|바지|패딩|자켓|코트/, "👕"], [/화장품|크림|로션|선크림|립/, "🧴"],
    [/샴푸|치약|세제|휴지|물티슈/, "🧻"], [/책|도서/, "📚"], [/장난감|레고/, "🧸"], [/기저귀|분유/, "🍼"],
    [/사료|강아지|고양이/, "🐾"], [/비타민|영양제/, "💊"],
  ];
  const emojiFor = (name) => (EMOJI_RULES.find(([re]) => re.test(name)) || [, "🛍️"])[1];

  const $app = document.getElementById("app");
  const $error = document.getElementById("error");
  const $toast = document.getElementById("toast");

  // ---------- 유틸 ----------
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
  const nf = new Intl.NumberFormat("ko-KR");
  const won = (n) => (n == null ? "—" : nf.format(n) + "원");
  const dateFmt = new Intl.DateTimeFormat("ko-KR", {
    year: "numeric", month: "long", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit",
  });
  const shortDateFmt = new Intl.DateTimeFormat("ko-KR", { month: "numeric", day: "numeric" });
  const logDateFmt = new Intl.DateTimeFormat("ko-KR", { month: "short", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
  const fmtLogDate = (s) => (new Date(s).getFullYear() === new Date().getFullYear() ? logDateFmt : dateFmt).format(new Date(s));
  const fmtDate = (s) => dateFmt.format(new Date(s));
  const fmtShort = (s) => shortDateFmt.format(new Date(s));
  const rtf = new Intl.RelativeTimeFormat("ko-KR", { numeric: "auto" });
  function fmtAgo(s) {
    const diff = (new Date(s) - Date.now()) / 1000;
    const units = [["day", 86400], ["hour", 3600], ["minute", 60]];
    for (const [u, sec] of units) if (Math.abs(diff) >= sec) return rtf.format(Math.round(diff / sec), u);
    return "방금 전";
  }

  // http(s) 링크만 허용 (javascript: 등 차단)
  function safeUrl(u) {
    if (!u) return null;
    try {
      const url = new URL(u);
      return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
    } catch { return null; }
  }

  // "12,900" / "12900원" → 12900
  function parsePrice(raw) {
    const s = String(raw ?? "").replace(/[,\s원]/g, "");
    if (s === "") return null;
    if (!/^\d+$/.test(s)) return NaN;
    return Number(s);
  }
  function validPrice(n) { return Number.isInteger(n) && n > 0 && n <= MAX_INT; }

  let toastTimer;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove("show"), 2200);
  }

  // ---------- 테마 ----------
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
  document.getElementById("themeBtn").addEventListener("click", () => {
    const current = root.dataset.theme
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    root.dataset.theme = current === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  });

  // ---------- 에러 표시 ----------
  function explain(err) {
    const msg = (err && (err.message || err.error_description || err.msg)) || String(err);
    const code = err && err.code ? String(err.code) : "";
    const blob = `${code} ${msg} ${err && err.details || ""} ${err && err.hint || ""}`;
    const hints = [];

    if (/Failed to fetch|NetworkError|Load failed|ERR_NAME_NOT_RESOLVED/i.test(blob)) {
      hints.push("Supabase 서버에 연결하지 못했습니다. <code>SUPABASE_URL</code> 이 정확한지(https://xxxx.supabase.co), 프로젝트가 일시중지(Paused) 상태는 아닌지 확인하세요.");
    }
    if (code === "42501" || /row-level security|permission denied/i.test(blob)) {
      hints.push("RLS(행 수준 보안) 정책에 막혔습니다. <code>schema.sql</code> 의 <code>create policy</code> 구문이 모두 실행됐는지 Supabase 대시보드 > Authentication > Policies 에서 확인하세요.");
    }
    if (code === "PGRST301" || code === "PGRST302" || /Invalid API key|JWT|apikey|No API key/i.test(blob)) {
      hints.push("API 키 문제입니다. <code>SUPABASE_ANON_KEY</code> 가 <b>이 프로젝트</b>의 anon(public) 키인지, 앞뒤 공백 없이 전체가 복사됐는지 확인하세요.");
    }
    if (code === "42P01" || code === "PGRST205" || code === "PGRST200" || /relation .* does not exist|schema cache|Could not find/i.test(blob)) {
      hints.push("테이블(또는 관계)을 찾지 못했습니다. Supabase SQL Editor 에서 <code>schema.sql</code> 을 실행했는지 확인하세요. 방금 실행했다면 몇 초 뒤 새로고침하세요.");
    }
    if (code === "NO_UPDATE" || /Bucket not found/i.test(blob) || (code === "42501" && /products|storage|objects/i.test(blob))) {
      hints.push("이미지 기능 설정이 필요합니다. Supabase SQL Editor 에서 <code>migrations/002_images.sql</code> 을 실행하세요.");
    }
    if (/maximum allowed size|Payload too large|too large/i.test(blob)) hints.push("파일이 너무 큽니다. 5MB 이하 이미지를 사용하세요.");
    if (/mime type/i.test(blob)) hints.push("JPG, PNG, WEBP, GIF 이미지만 올릴 수 있습니다.");
    if (code === "NO_FUNCTION") hints.push("자동 이미지 기능(Edge Function <code>og-image</code>)이 아직 배포되지 않았습니다. README 의 \"자동 이미지\" 안내를 따라 배포하세요.");
    if (code === "FETCH_META") hints.push("상품 페이지에서 이미지를 가져오지 못했습니다. 쿠팡처럼 자동 접근을 막는 사이트는 사진을 직접 올려주세요.");
    if (code === "42703") hints.push("컬럼이 없습니다. <code>migrations/001_image_url.sql</code> 을 SQL Editor 에서 실행하세요.");
    if (code === "23514") hints.push("가격은 1원 이상의 정수여야 합니다 (CHECK 제약 위반).");
    if (code === "23503") hints.push("존재하지 않는 상품입니다. 목록을 새로고침하세요.");
    if (code === "22003") hints.push("숫자가 너무 큽니다. 21억 원 이하로 입력하세요.");
    if (!hints.length) hints.push("아래 원본 메시지를 확인하세요.");
    return { msg, code, hints };
  }

  function showError(err, title = "요청에 실패했습니다") {
    console.error(err);
    const { msg, code, hints } = explain(err);
    $error.innerHTML = `
      <div class="error" role="alert">
        <strong>⚠️ ${esc(title)}</strong>
        <ul>${hints.map((h) => `<li>${h}</li>`).join("")}</ul>
        <div class="raw">원본: ${code ? `[${esc(code)}] ` : ""}${esc(msg)}</div>
      </div>`;
    $error.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function showConfigError(html) {
    $error.innerHTML = `<div class="error" role="alert"><strong>⚠️ 설정이 필요합니다</strong><ul><li>${html}</li></ul></div>`;
    $app.innerHTML = "";
  }
  const clearError = () => { $error.innerHTML = ""; };

  // ---------- 설정 검사 ----------
  function jwtRole(key) {
    try {
      const part = key.split(".")[1];
      const json = atob(part.replace(/-/g, "+").replace(/_/g, "/"));
      return JSON.parse(json).role;
    } catch { return null; }
  }

  function checkConfig() {
    if (!window.supabase || !window.supabase.createClient) {
      return "supabase-js 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 jsDelivr CDN 차단 여부를 확인하세요.";
    }
    if (!SUPABASE_URL || SUPABASE_URL.includes("YOUR-PROJECT") || !/^https:\/\/.+/.test(SUPABASE_URL)) {
      return "<code>index.html</code> 맨 위의 <code>SUPABASE_URL</code> 을 채워주세요. (Project Settings > API > Project URL)";
    }
    if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes("YOUR-ANON-KEY")) {
      return "<code>index.html</code> 맨 위의 <code>SUPABASE_ANON_KEY</code> 를 채워주세요. (Project Settings > API > anon public 키)";
    }
    if (SUPABASE_ANON_KEY.startsWith("sb_secret_") || jwtRole(SUPABASE_ANON_KEY) === "service_role") {
      return "<b>service_role / secret 키가 들어 있습니다.</b> 이 키는 RLS를 우회하므로 브라우저에 절대 노출하면 안 됩니다. 즉시 anon(public) 키로 바꾸고, 이미 배포했다면 Supabase에서 해당 키를 재발급(rotate)하세요.";
    }
    return null;
  }

  const configProblem = checkConfig();
  if (configProblem) { showConfigError(configProblem); return; }

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false },
  });

  // ---------- 데이터 ----------
  let products = [];   // [{...product, logs: [최신순]}]
  let loaded = false;
  let hasImageCol = true;          // migrations/001_image_url.sql 실행 여부
  const view = { filter: "all", sort: "recent" };

  function withStats(p) {
    const logs = (p.price_logs || []).slice().sort((a, b) => new Date(b.logged_at) - new Date(a.logged_at));
    const prices = logs.map((l) => l.price);
    const latest = logs[0] ? logs[0].price : null;
    const prev = logs[1] ? logs[1].price : null;
    const min = prices.length ? Math.min(...prices) : null;
    const max = prices.length ? Math.max(...prices) : null;
    const avg = prices.length ? Math.round(prices.reduce((s, v) => s + v, 0) / prices.length) : null;
    const hit = latest != null && p.target_price != null && latest <= p.target_price;
    const change = latest != null && prev != null ? latest - prev : null;
    return { ...p, logs, latest, prev, min, max, avg, hit, change };
  }

  async function loadProducts() {
    const cols = "id, name, store, url, target_price, created_at, price_logs(id, price, logged_at)";
    let res = await db.from("products")
      .select(hasImageCol ? `${cols}, image_url` : cols)
      .order("created_at", { ascending: false });
    if (res.error && res.error.code === "42703" && hasImageCol) {
      // image_url 컬럼이 아직 없으면 이미지 없이 동작
      hasImageCol = false;
      res = await db.from("products").select(cols).order("created_at", { ascending: false });
    }
    if (res.error) throw res.error;
    products = res.data.map(withStats);
    loaded = true;
  }

  // ---------- 시각 요소 ----------
  function thumbHtml(p, localSrc) {
    const cls = STORE_CLASS[p.store] || "s-etc";
    const img = localSrc || safeUrl(p.image_url);
    const initial = esc(String(p.name || "?").trim().charAt(0));
    return `
      <div class="thumb ${cls}" aria-hidden="true">
        <span class="initial">${initial}</span>
        <span class="emoji">${emojiFor(p.name || "")}</span>
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      </div>`;
  }

  function changeHtml(p) {
    if (p.change == null) return "";
    if (p.change === 0) return `<div class="change flat">— 직전과 동일</div>`;
    const pct = Math.abs((p.change / p.prev) * 100).toFixed(1);
    return p.change < 0
      ? `<div class="change down">▼ ${nf.format(-p.change)}원 (${pct}%)</div>`
      : `<div class="change up">▲ ${nf.format(p.change)}원 (${pct}%)</div>`;
  }

  // 카드용 스파크라인: 최근 12개 기록
  function sparkHtml(p, w = 96, h = 40) {
    const asc = p.logs.slice(0, 12).reverse();
    if (asc.length < 2) return "";
    const vals = asc.map((l) => l.price);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const showTarget = p.target_price != null && p.target_price >= lo * 0.85 && p.target_price <= hi * 1.15;
    if (showTarget) { lo = Math.min(lo, p.target_price); hi = Math.max(hi, p.target_price); }
    if (lo === hi) { lo -= 1; hi += 1; }
    const pad = 4;
    const x = (i) => pad + (i / (asc.length - 1)) * (w - pad * 2);
    const y = (v) => pad + (1 - (v - lo) / (hi - lo)) * (h - pad * 2);
    const d = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const a = `${d}L${x(vals.length - 1).toFixed(1)},${h}L${x(0).toFixed(1)},${h}Z`;
    const trend = vals[vals.length - 1] < vals[0] ? "down" : vals[vals.length - 1] > vals[0] ? "up" : "";
    return `
      <svg class="spark ${trend}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
        ${showTarget ? `<line x1="0" x2="${w}" y1="${y(p.target_price).toFixed(1)}" y2="${y(p.target_price).toFixed(1)}"/>` : ""}
        <path class="a" d="${a}"/><path class="l" d="${d}"/>
        <circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}" r="3"/>
      </svg>`;
  }

  // 목표가 진행 바
  function meterHtml(p) {
    if (p.target_price == null) {
      return `<div class="meter"><div class="meter-bar"><i style="width:0"></i></div>
        <div class="meter-label"><span>목표가 미설정</span></div></div>`;
    }
    if (p.latest == null) {
      return `<div class="meter"><div class="meter-bar"><i style="width:0"></i></div>
        <div class="meter-label"><span>목표 ${won(p.target_price)}</span><span>기록 없음</span></div></div>`;
    }
    if (p.hit) {
      const under = p.target_price - p.latest;
      return `<div class="meter hit"><div class="meter-bar"><i style="width:100%"></i></div>
        <div class="meter-label"><span>목표 ${won(p.target_price)}</span><b>${under ? `${won(under)} 저렴` : "딱 목표가"}</b></div></div>`;
    }
    const pct = Math.max(4, Math.min(99, (p.target_price / p.latest) * 100));
    return `<div class="meter"><div class="meter-bar"><i style="width:${pct.toFixed(0)}%"></i></div>
      <div class="meter-label"><span>목표 ${won(p.target_price)}</span><span>${won(p.latest - p.target_price)} 남음</span></div></div>`;
  }

  // ---------- 화면: 목록 ----------
  function visibleProducts() {
    let list = products.slice();
    if (view.filter === "hit") list = list.filter((p) => p.hit);
    else if (view.filter === "drop") list = list.filter((p) => p.change != null && p.change < 0);
    else if (view.filter !== "all") list = list.filter((p) => p.store === view.filter);

    const gap = (p) => (p.latest == null || p.target_price == null ? Infinity : (p.latest - p.target_price) / p.target_price);
    if (view.sort === "cheap") list.sort((a, b) => (a.latest ?? Infinity) - (b.latest ?? Infinity));
    else if (view.sort === "near") list.sort((a, b) => gap(a) - gap(b));
    else if (view.sort === "drop") list.sort((a, b) => (a.change ?? 0) / (a.prev || 1) - (b.change ?? 0) / (b.prev || 1));
    return list;
  }

  function renderList() {
    const hitCount = products.filter((p) => p.hit).length;
    const dropCount = products.filter((p) => p.change != null && p.change < 0).length;
    const storesUsed = STORES.filter((s) => products.some((p) => p.store === s));
    const chip = (key, label) => `<button type="button" class="chip" data-filter="${esc(key)}" aria-pressed="${view.filter === key}">${label}</button>`;
    const list = visibleProducts();

    $app.innerHTML = `
      <div class="stack">
        <section class="hero">
          <p>${products.length ? (hitCount ? `🎉 ${hitCount}개 상품이 목표가에 도달했어요!` : "목표가에 도달하면 여기서 알려드려요.") : "첫 상품을 등록하고 가격을 추적해 보세요."}</p>
          <div class="hero-stats num">
            <div class="hero-stat"><b>${products.length}</b><span>추적 중</span></div>
            <div class="hero-stat"><b>${hitCount}</b><span>목표가 도달</span></div>
            <div class="hero-stat"><b>${dropCount}</b><span>가격 하락</span></div>
          </div>
        </section>

        <details class="panel add" ${products.length ? "" : "open"}>
          <summary>상품 추가 <span class="plus">＋</span></summary>
          <div class="add-body">
            <form id="addForm" novalidate>
              <label>상품 이름
                <input name="name" required maxlength="200" placeholder="예) 삼다수 2L 12병" autocomplete="off">
              </label>
              <label>쇼핑몰
                <select name="store">${STORES.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
              </label>
              <label class="full">상품 URL (선택)
                <input name="url" type="url" inputmode="url" placeholder="상품 페이지 주소를 붙여넣으면 이미지·이름을 자동으로 채워요" autocomplete="off">
                <span class="file-name" id="urlStatus" aria-live="polite"></span>
              </label>
              ${hasImageCol ? `
              <div class="full">
                <label style="margin-bottom:4px">상품 이미지 (선택)</label>
                <div class="img-pick">
                  <label class="file-btn">📷 사진 선택<input type="file" name="image_file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
                  <input name="image_url" type="url" inputmode="url" aria-label="이미지 주소" placeholder="또는 이미지 주소 붙여넣기" autocomplete="off">
                </div>
                <div class="file-name" id="fileName"></div>
              </div>` : ""}
              <label>목표가 (선택, 원)
                <input name="target_price" inputmode="numeric" placeholder="예) 9,900" autocomplete="off">
              </label>

  let previewUrl = null;   // 선택한 파일의 blob: 미리보기 URL

  // ---------- 상품 URL → 이미지/이름 자동 채우기 (Edge Function: og-image) ----------
  const STORE_HOSTS = [[/coupang\.com$/, "쿠팡"], [/costco\.co\.kr$/, "코스트코"], [/naver\.com$/, "네이버"], [/11st\.co\.kr$/, "11번가"]];
  const storeFromUrl = (u) => (STORE_HOSTS.find(([re]) => re.test(new URL(u).hostname)) || [])[1] || null;
  // "상품명 - 쿠팡!" / "상품명 | 코스트코 코리아" 같은 쇼핑몰 꼬리표 제거
  const cleanTitle = (t) => t.replace(/\s*[|:\-–]\s*(쿠팡|코스트코|11번가|네이버|G마켓|옥션|SSG|스마트스토어)[^|:\-–]*$/i, "").trim().slice(0, 200);

  async function fetchMeta(url) {
    const { data, error } = await db.functions.invoke("og-image", { body: { url } });
    if (error) {
      let msg = error.message;
      try { const body = await error.context.json(); if (body && body.error) msg = body.error; } catch {}
      const missing = error.name === "FunctionsFetchError" || error.name === "FunctionsRelayError"
        || (error.context && error.context.status === 404);
      throw { code: missing ? "NO_FUNCTION" : "FETCH_META", message: msg };
    }
    return data;
  }

  let autoImage = null;   // 자동으로 채운 이미지 주소 (사용자가 직접 바꾸면 덮어쓰지 않음)
  let metaSeq = 0;
  async function autoFill(form) {
    const field = (n) => form.elements.namedItem(n);
    const $s = document.getElementById("urlStatus");
    const u = safeUrl(field("url").value.trim());
    if (!u) { $s.textContent = ""; return; }

    const store = storeFromUrl(u);
    if (store) field("store").value = store;
    if (!hasImageCol) return updatePreview(form);

    const seq = ++metaSeq;
    $s.textContent = "🔎 상품 이미지를 찾는 중…";
    try {
      const meta = await fetchMeta(u);
      if (seq !== metaSeq) return;
      if (meta.title && !field("name").value.trim()) field("name").value = cleanTitle(meta.title);
      const img = field("image_url");
      if (meta.image && (!img.value.trim() || img.value === autoImage)) {
        img.value = meta.image;
        autoImage = meta.image;
      }
      $s.textContent = meta.image ? "✓ 상품 이미지를 찾았어요" : "이 페이지에서 이미지를 찾지 못했어요. 사진을 직접 올려주세요.";
    } catch (err) {
      if (seq !== metaSeq) return;
      $s.textContent = err.code === "NO_FUNCTION"
        ? "자동 이미지 기능이 아직 설정되지 않았어요 (og-image 함수 배포 필요)."
        : `이미지를 가져오지 못했어요: ${err.message}`;
    }
    updatePreview(form);
  }

  // ---------- 이미지 업로드 (Supabase Storage) ----------
  const BUCKET = "product-images";
  const IMAGE_TYPES = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/gif": "gif" };

  // 업로드 전에 긴 변을 1000px 로 줄여 용량 절약 (GIF 는 애니메이션 보존을 위해 그대로)
  async function shrinkImage(file, max = 1000) {
    if (file.type === "image/gif") return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale);
      c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, "image/webp", 0.85));
      if (blob && IMAGE_TYPES[blob.type] && blob.size < file.size) return blob;
    } catch {}
    return file;
  }

  async function uploadImage(file) {
    if (!IMAGE_TYPES[file.type]) throw { message: "JPG, PNG, WEBP, GIF 이미지만 올릴 수 있어요." };
    const blob = await shrinkImage(file);
    if (blob.size > 5 * 1024 * 1024) throw { message: "이미지가 5MB를 넘어요. 더 작은 사진을 골라주세요." };
    const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const path = `${id}.${IMAGE_TYPES[blob.type]}`;
    const { error } = await db.storage.from(BUCKET).upload(path, blob, { contentType: blob.type, upsert: false });
    if (error) throw error;
    return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

    if (!data.length) throw { code: "NO_UPDATE", message: "이미지를 저장할 권한이 없습니다 (0행 수정됨)." };
  }

  // ---------- SVG 라인 차트 (외부 라이브러리 없음) ----------
  let chartArgs = null;
  function drawChart(logsAsc, target) {
    chartArgs = [logsAsc, target];
    const el = document.getElementById("chart");
    if (!el) return;
    if (!logsAsc.length) {
      el.innerHTML = `<div class="empty"><span class="big">📈</span>가격을 기록하면 추이 그래프가 나타나요.</div>`;
      return;
    }

    const W = Math.max(300, Math.round(el.clientWidth || 600));
    const H = W < 500 ? 220 : 280;
    const pad = { t: 22, r: 14, b: 28, l: 72 };
    const iw = W - pad.l - pad.r;
    const ih = H - pad.t - pad.b;

    const prices = logsAsc.map((l) => l.price);
    let lo = Math.min(...prices, target ?? Infinity);
    let hi = Math.max(...prices, target ?? -Infinity);
    if (lo === hi) { lo = lo * 0.9; hi = hi * 1.1; }
    const span = hi - lo;
    // 눈금이 1,000 / 5,000 / 10,000 처럼 떨어지도록 범위를 맞춤
    const raw = (span * 1.2) / 3;
    const mag = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].find((n) => n * mag >= raw) * mag;
    lo = Math.max(0, Math.floor((lo - span * 0.08) / step) * step);
    hi = Math.ceil((hi + span * 0.08) / step) * step;

    const times = logsAsc.map((l) => new Date(l.logged_at).getTime());
    const t0 = times[0], t1 = times[times.length - 1];
    const byTime = t1 > t0;
    const x = (i) => logsAsc.length === 1
      ? pad.l + iw / 2
      : pad.l + (byTime ? (times[i] - t0) / (t1 - t0) : i / (logsAsc.length - 1)) * iw;
    const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * ih;

    const ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
    const grid = ticks.map((v) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`).join("");
    const yLabels = ticks.map((v) => `<text x="${pad.l - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${nf.format(Math.round(v))}</text>`).join("");

    const pts = logsAsc.map((l, i) => [x(i), y(l.price)]);
    const line = pts.map(([px, py], i) => `${i ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`).join("");
    const area = pts.length > 1
      ? `${line}L${pts[pts.length - 1][0].toFixed(1)},${(pad.t + ih).toFixed(1)}L${pts[0][0].toFixed(1)},${(pad.t + ih).toFixed(1)}Z`
      : "";

    const minPrice = Math.min(...prices);
    const minIdx = prices.lastIndexOf(minPrice);
    const lastIdx = prices.length - 1;
    const dots = pts.map(([px, py], i) => {
      const cls = i === lastIdx ? "dot last" : i === minIdx ? "dot min" : "dot";
      const r = i === lastIdx || i === minIdx ? 5 : 3.5;
      return `<circle class="${cls}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r}">
        <title>${esc(fmtDate(logsAsc[i].logged_at))} · ${esc(won(logsAsc[i].price))}</title></circle>`;
    }).join("");

    const [lx, ly] = pts[lastIdx];
    const lastAnchor = lx > W - 90 ? "end" : "start";
    const lastLabel = `<text class="label" x="${(lx + (lastAnchor === "end" ? -8 : 8)).toFixed(1)}" y="${(ly - 10).toFixed(1)}" text-anchor="${lastAnchor}">${esc(won(prices[lastIdx]))}</text>`;

    // 목표가 라벨이 최근가 라벨과 겹치면 왼쪽 끝으로 옮김
    const ty = target != null ? y(target) : 0;
    const clash = target != null && lastAnchor === "end" && Math.abs(ty - ly) < 26;
    const targetLine = target != null ? `
      <g class="target">
        <line x1="${pad.l}" x2="${W - pad.r}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}"/>
        <text x="${clash ? pad.l + 4 : W - pad.r}" y="${(ty + (ty - pad.t < 14 ? 14 : -6)).toFixed(1)}"
              text-anchor="${clash ? "start" : "end"}">목표 ${esc(won(target))}</text>
      </g>` : "";

    const xLabels = logsAsc.length > 1
      ? `<text x="${pad.l}" y="${H - 8}" text-anchor="start">${esc(fmtShort(logsAsc[0].logged_at))}</text>
         <text x="${W - pad.r}" y="${H - 8}" text-anchor="end">${esc(fmtShort(logsAsc[lastIdx].logged_at))}</text>`
      : `<text x="${pad.l + iw / 2}" y="${H - 8}" text-anchor="middle">${esc(fmtShort(logsAsc[0].logged_at))}</text>`;

    el.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
           aria-label="가격 추이 차트: 기록 ${logsAsc.length}개, 최저 ${esc(won(minPrice))}, 최근 ${esc(won(prices[lastIdx]))}">
        <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop class="s0" offset="0"/><stop class="s1" offset="1"/>
        </linearGradient></defs>
        <g class="grid">${grid}</g>
        <g class="axis">${yLabels}${xLabels}</g>
        ${area ? `<path d="${area}" fill="url(#areaGrad)"/>` : ""}
        ${targetLine}
        <path class="line" d="${line}"/>
        ${dots}
        ${lastLabel}
      </svg>
      <p class="chart-note">● 채운 점: 최근가 · <span style="color:var(--good)">●</span> 역대 최저가${target != null ? " · 점선: 목표가" : ""}</p>`;
  }

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (chartArgs && document.getElementById("chart")) drawChart(...chartArgs); }, 150);
  });

  // ---------- 라우팅 ----------
  function route() {
    if (!loaded) return;
    chartArgs = null;
    const m = location.hash.match(/^#\/p\/(\d+)/);
    if (m) renderDetail(m[1]); else renderList();
  }
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

  (async () => {
    try {
      await loadProducts();
      route();
    } catch (err) {
      showError(err, "상품 목록을 불러오지 못했습니다");
      $app.innerHTML = "";
    }
  })();
})();
</script>
</body>
</html>
